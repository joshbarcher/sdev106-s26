<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Weather Form</title>
        <link rel="stylesheet" href="form.css">
    </head>
    <body>
        <section>
            <h1>Weather Condition Report</h1>
            <p>Submit your current local observations</p>
        </section>

        <form action="#">
            <section id="top">
                <div class="widget">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="loc" 
                           required minlength="4" maxlength="20">
                </div>
    
                <div class="widget">
                    <label for="temp">State</label>
                    <select>
                        <optgroup>
                            <option value="AL">Alabama</option>
                            <option value="AK">Alaska</option>
                            <option value="AZ">Arizona</option>
                            <option value="AR">Arkansas</option>
                            <option value="CA">California</option>
                            <option value="CO">Colorado</option>
                            <option value="CT">Connecticut</option>
                            <option value="DE">Delaware</option>
                            <option value="DC">District Of Columbia</option>
                            <option value="FL">Florida</option>
                            <option value="GA">Georgia</option>
                            <option value="HI">Hawaii</option>
                            <option value="ID">Idaho</option>
                            <option value="IL">Illinois</option>
                            <option value="IN">Indiana</option>
                            <option value="IA">Iowa</option>
                            <option value="KS">Kansas</option>
                            <option value="KY">Kentucky</option>
                            <option value="LA">Louisiana</option>
                            <option value="ME">Maine</option>
                            <option value="MD">Maryland</option>
                            <option value="MA">Massachusetts</option>
                            <option value="MI">Michigan</option>
                            <option value="MN">Minnesota</option>
                            <option value="MS">Mississippi</option>
                            <option value="MO">Missouri</option>
                            <option value="MT">Montana</option>
                            <option value="NE">Nebraska</option>
                            <option value="NV">Nevada</option>
                            <option value="NH">New Hampshire</option>
                            <option value="NJ">New Jersey</option>
                            <option value="NM">New Mexico</option>
                            <option value="NY">New York</option>
                            <option value="NC">North Carolina</option>
                            <option value="ND">North Dakota</option>
                            <option value="OH">Ohio</option>
                            <option value="OK">Oklahoma</option>
                            <option value="OR">Oregon</option>
                            <option value="PA">Pennsylvania</option>
                            <option value="RI">Rhode Island</option>
                            <option value="SC">South Carolina</option>
                            <option value="SD">South Dakota</option>
                            <option value="TN">Tennessee</option>
                            <option value="TX">Texas</option>
                            <option value="UT">Utah</option>
                            <option value="VT">Vermont</option>
                            <option value="VA">Virginia</option>
                            <option value="WA">Washington</option>
                            <option value="WV">West Virginia</option>
                            <option value="WI">Wisconsin</option>
                            <option value="WY">Wyoming</option>
                        </optgroup>
                        <optgroup label="--------------------">
                            <option value="AS">American Samoa</option>
                            <option value="GU">Guam</option>
                            <option value="MP">Northern Mariana Islands</option>
                            <option value="PR">Puerto Rico</option>
                            <option value="UM">United States Minor Outlying Islands</option>
                            <option value="VI">Virgin Islands</option>
                        </optgroup>
                    </select>
                </div>
    
                <div class="widget">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"> <!-- date picker -->
                </div>
    
                <div class="widget">
                    <label for="time">Time</label>
                    <input type="time" id="time" name="time"> <!-- time picker -->
                </div>
    
                <div class="widget">
                    <label for="temp">Temperature (Farenheit)</label>
                    <input type="number" id="temp" name="temperature"
                           required min="-30" max="110"> <!-- time picker -->
                </div>
    
                <div class="widget">
                    <label for="temp">Wind</label>
                    <select name="wind">
                        <option value="calm">Calm (0-1 mph)</option>
                        <option value="light">Light (2-12 mph)</option>
                        <option value="moderate">Moderate (13-24 mph)</option>
                        <option value="strong">Strong (25-38 mph)</option>
                        <option value="gale">Gale (39-54 mph)</option>
                        <option value="storm">Storm (55+ mph)</option>
                    </select>
                </div>
            </section>

            <div id="notes-container" class="widget">
                <label for="notes">Observer Notes</label>
                <textarea id="notes" name="notes"></textarea>
            </div>

            <fieldset>
                <legend>Rain Conditions</legend>

                <div class="rb">
                    <input type="radio" id="dry" name="rain-condition" value="dry" checked>
                    <label for="dry">Dry</label>
                </div>

                <div class="rb">
                    <input type="radio" id="drizzle" name="rain-condition" value="drizzle">
                    <label for="drizzle">Drizzle</label>
                </div>

                <div class="rb">
                    <input type="radio" id="rain" name="rain-condition" value="raining">
                    <label for="rain">Raining</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Sunny?</legend>

                <div class="rb">
                    <input type="radio" id="sun" name="sun-condition" value="sun" checked>
                    <label for="sun">Yes</label>
                </div>

                <div class="rb">
                    <input type="radio" id="no-sun" name="sun-condition" value="no-sun">
                    <label for="no-sun">No</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>General Conditions</legend>

                <div class="rb">
                    <input type="checkbox" id="lightning" name="lightning">
                    <label for="lightning">Lightning</label>
                </div>
                <div class="rb">
                    <input type="checkbox" id="thunder" name="thunder">
                    <label for="thunder">Thunder</label>
                </div>
                <div class="rb">
                    <input type="checkbox" id="foggy" name="foggy">
                    <label for="foggy">Foggy</label>
                </div>
            </fieldset>

            <section class="widget">
                <label for="color">Color The Weather</label>
                <input type="color" id="color" name="my-color"> <!-- color picker! -->
            </section>

            <section class="widget">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"> <!-- this uses regular expressions to check for an email -->
            </section>

            <fieldset>
                <legend>Log In Please</legend>

                <section class="widget">
                    <label for="user">Username</label>
                    <input type="text" id="user" name="username">
                </section>

                <section class="widget">
                    <label for="pwd">Password</label>
                    <input type="password" id="pwd" name="password">
                </section>
            </fieldset>

            <button type="submit">Submit Weather Values!</button>
        </form>
    </body>
</html>
